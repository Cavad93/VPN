name: Build iOS IPA (SideStore)

on:
  push:
    branches: [ "main", "claude/*" ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14    # Apple Silicon runner (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use Xcode 16 if available, fall back to 15
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif ls -d /Applications/Xcode_16*.app 2>/dev/null | head -1 > /dev/null; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          echo "Generated CavadVPN.xcodeproj:"
          ls -la CavadVPN.xcodeproj/

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme CavadVPN \
            -project CavadVPN.xcodeproj \
            2>&1 | tail -20

      - name: Build for iOS device (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail

          xcodebuild build \
            -scheme CavadVPN \
            -project CavadVPN.xcodeproj \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            -skipPackagePluginValidation \
            -destination "generic/platform=iOS" \
            | tee /tmp/xcodebuild.log | tail -80

          echo ""
          echo "=== Build directory contents ==="
          find "$PWD/build" -name "*.app" -type d 2>/dev/null || true
          ls -R "$PWD/build/Build/Products/" 2>/dev/null || true

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== FULL BUILD LOG (last 200 lines) ==="
          tail -200 /tmp/xcodebuild.log 2>/dev/null || echo "No build log found"
          echo ""
          echo "=== Errors only ==="
          grep -i "error:" /tmp/xcodebuild.log 2>/dev/null || echo "No errors found in log"

      - name: Create IPA from build
        working-directory: ios
        run: |
          # Find the .app bundle
          APP_PATH=$(find "$PWD/build" -name "CavadVPN.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: CavadVPN.app not found"
            echo "Build directory contents:"
            find "$PWD/build" -type d -maxdepth 5 2>/dev/null || echo "build dir does not exist"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          # Create Payload directory structure for IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # Create IPA (just a renamed zip)
          zip -r build/CavadVPN.ipa Payload/
          echo "IPA created: $(ls -lh build/CavadVPN.ipa)"
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CavadVPN-iOS
          path: ios/build/CavadVPN.ipa
          retention-days: 90

      - name: Create SideStore source JSON
        working-directory: ios
        run: |
          VERSION=$(grep -A1 CFBundleShortVersionString App/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>/\1/' || echo "1.0.0")
          BUILD=$(grep -A1 CFBundleVersion App/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>/\1/' || echo "1")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > build/sidestore-source.json << EOF
          {
            "name": "CavadVPN",
            "identifier": "com.cavadvpn.source",
            "sourceURL": "",
            "apps": [
              {
                "name": "CavadVPN",
                "bundleIdentifier": "com.cavadvpn.ios",
                "developerName": "CavadVPN",
                "subtitle": "Secure VPN with Noise protocol",
                "version": "${VERSION}",
                "versionDate": "${DATE}",
                "versionDescription": "CavadVPN v${VERSION} build ${BUILD}",
                "downloadURL": "",
                "localizedDescription": "CavadVPN - secure VPN client with Noise_XX handshake, ChaCha20-Poly1305 encryption, TLS obfuscation, and SideStore auto-refresh support.",
                "iconURL": "",
                "size": 0,
                "screenshotURLs": []
              }
            ],
            "news": []
          }
          EOF
          echo "SideStore source JSON created"

      - name: Upload SideStore source
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-Source
          path: ios/build/sidestore-source.json
          retention-days: 90
